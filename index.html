<!doctype html>
<html lang="en" class="dark bg-black text-white antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <script>
      // Saved theme before the CSS paints, so light-theme users don't see a black flash (src/lib/theme.ts).
      (function () {
        try {
          var t = localStorage.getItem('kova_theme');
          var light = { daylight: '#f2efe8', 'solarized-light': '#fdf6e3', 'solarized-gold': '#f2e3bc' };
          var dark = { midnight: '#000000', dusk: '#14161b', 'solarized-dark': '#002b36', forest: '#0d1511', nord: '#242933' };
          var color = light[t] || dark[t];
          if (!color) return;
          var root = document.documentElement;
          root.setAttribute('data-theme', t);
          if (light[t]) { root.classList.remove('dark'); root.classList.add('light'); }
          document.querySelector('meta[name="theme-color"]').setAttribute('content', color);
        } catch (e) {}
      })();
    </script>
    <title>Kova — Financial Companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..800&family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-black text-white selection:bg-white selection:text-black overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
